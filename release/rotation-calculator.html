:root {
  --bg: #f1f3f9; --card: #ffffff; --ink: #1e293b; --muted: #64748b; --line: #e2e8f0; --soft: #f8fafc;
  --accent: #4f46e5; --accent-2: #6366f1; --accent-soft: #eef2ff; --ok: #059669; --err: #dc2626; --focus: #f59e0b;
  --font: "Rotation Georgian", "Noto Sans Georgian", "Sylfaen", "DejaVu Sans", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; overflow-wrap: anywhere; }
body.modal-open { overflow: hidden; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h2:focus { outline: none; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.print-only { display: none; }
.muted { color: var(--muted); } .small { font-size: .88rem; } .tiny { font-size: .75rem; } .block { display: block; }

.wrap { max-width: 920px; margin: 0 auto; padding: 28px 16px 40px; }
.head { text-align: center; margin-bottom: 22px; }
.head h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.1rem); color: var(--accent); letter-spacing: .01em; }
.head p { margin: 4px 0 0; color: var(--muted); }
.link-btn { margin-top: 8px; background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px; }

/* progress pills */
.pills { list-style: none; margin: 0 0 18px; padding: 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.pill { font: inherit; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; font-size: .9rem; }
.pill[disabled] { cursor: default; opacity: .7; }
.pill-n { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--line); color: var(--muted); font-weight: 700; font-size: .85rem; }
.pill.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pill.active .pill-n { background: var(--accent); color: #fff; }
.pill.done { color: var(--ok); border-color: #a7f3d0; }
.pill.done .pill-n { background: var(--ok); color: #fff; }
@media (max-width: 600px) { .pill:not(.active) .pill-t { display: none; } .pill:not(.active) { padding: 4px; } .pills { gap: 6px; } }

.card { background: var(--card); border-radius: 22px; box-shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 12px 32px rgba(15, 23, 42, .06); }
.step-body { padding: 30px 32px 10px; }
@media (max-width: 600px) { .step-body { padding: 22px 18px 6px; } }
.step-body h2 { margin: 0 0 4px; font-size: 1.35rem; }
.lead { margin: 0 0 18px; color: var(--muted); }
h3 { font-size: 1rem; margin: 24px 0 10px; }
.nav { display: flex; justify-content: space-between; gap: 10px; padding: 16px 32px 26px; border-top: 1px solid var(--line); margin-top: 18px; }
.nav .spacer { flex: 1; }
@media (max-width: 600px) { .nav { padding: 14px 18px 20px; } }

/* fields */
.field { display: flex; flex-direction: column; gap: 6px; margin: 0 0 16px; min-width: 0; }
label { font-weight: 600; font-size: .93rem; }
input[type=text], select { font: inherit; width: 100%; min-width: 0; min-height: 48px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--soft); color: var(--ink); transition: border-color .15s, background .15s; }
input[type=text]:focus, select:focus { border-color: var(--accent); background: #fff; outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input.short { max-width: 160px; }
input[aria-invalid=true] { border-color: var(--err); background: #fef2f2; }
.err { color: var(--err); font-size: .85rem; margin: 0; font-weight: 600; }
.err:empty { display: none; }
.with-cur { display: flex; align-items: center; gap: 10px; }
.with-cur input { flex: 1 1 auto; }
.cur { font-weight: 700; color: var(--muted); min-width: 2.6em; }
.need { color: var(--err); font-weight: 600; margin: -6px 0 12px; }
.need:focus { outline: none; }

/* picker */
.pk-wrap { position: relative; }
.pk-list { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); max-height: 330px; overflow-y: auto; margin: 0; padding: 6px; list-style: none; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(15, 23, 42, .16); }
.pk-group { font-size: .75rem; font-weight: 700; color: var(--muted); padding: 8px 10px 2px; text-transform: uppercase; letter-spacing: .03em; }
.pk-opt { padding: 9px 12px; border-radius: 9px; cursor: pointer; }
.pk-opt[aria-selected=true], .pk-opt:hover { background: var(--accent-soft); color: var(--accent); }
.pk-empty { padding: 10px; color: var(--muted); }
.info-line { margin: -4px 0 14px; color: var(--muted); font-size: .9rem; }
.info-line:empty { display: none; }

/* market card */
.mcard { background: var(--soft); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin: 4px 0 6px; }
.mcard h3 { margin: 0 0 8px; font-size: .95rem; }
.mlist { display: flex; flex-direction: column; }
.mrow { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.mrow:last-of-type { border-bottom: 0; }
.mrow-l { color: var(--muted); }

.toggle { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 14px; margin: 0 0 16px; }
.toggle label { display: flex; flex-direction: column; gap: 2px; font-weight: 400; cursor: pointer; }
input[role=switch] { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; border-radius: 999px; background: #cbd5e1; position: relative; flex: none; cursor: pointer; margin: 0; transition: background .15s; }
input[role=switch]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
input[role=switch]:checked { background: var(--accent); }
input[role=switch]:checked::after { transform: translateX(18px); }

.btn-add { font: inherit; font-weight: 600; width: 100%; padding: 12px; border-radius: 14px; border: 2px dashed #c7d2fe; background: var(--accent-soft); color: var(--accent); cursor: pointer; }

.chip-box:empty { display: none; }
.chip { font: inherit; font-size: .86rem; text-align: left; padding: 7px 12px; border-radius: 999px; border: 1px solid #c7d2fe; background: var(--accent-soft); color: var(--accent); cursor: pointer; }
.extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.ex { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.ex.on, .ex:has(input:checked) { border-color: #c7d2fe; background: #fafaff; }
.ex-head { display: flex; gap: 10px; align-items: center; }

.ex-body { margin-top: 10px; }
.ex-body .field { margin-bottom: 4px; }
.row2 { display: flex; gap: 10px; align-items: flex-end; }
.row2 .field { flex: 1; margin: 0; }
.cur-sel { width: auto; min-width: 90px; }

/* buttons */
.btn { font: inherit; font-weight: 700; min-height: 48px; padding: 10px 22px; border-radius: 12px; border: 0; background: linear-gradient(135deg, var(--accent), #7c3aed); color: #fff; cursor: pointer; box-shadow: 0 4px 12px rgba(79, 70, 229, .25); }

      const prof = () => profiles().find((p) => p.id === st.mode);
      const suggestHead2 = (e) => e?.suggestedRentHead === "head" || e?.suggestedRentHead === "head-consular";
      const segName = uid("seg");
      const seg = h(
        "div",
        { class: "seg", role: "radiogroup", "aria-label": "თანამდებობების სია" },
        [["annex2", "საელჩო / საკონსულო"], ["annex3", "ცენტრალური აპარატი"]].map(([v2, t]) => {
          const id = uid("f");
          const inp = h("input", { id, type: "radio", name: segName, value: v2, checked: st.mode === v2 });
          inp.addEventListener("change", () => {
            const old = prof()?.entries.find((e) => e.id === st.entryId)?.positions_ka?.[0];
            st.mode = v2;
            st.entryId = prof()?.entries.find((e) => e.positions_ka?.includes(old))?.id ?? null;
            fillPos();
          });
          return h("span", { class: "seg-opt" }, inp, h("label", { for: id }, t));
        })
      );
      const posId = uid("f");
      const pos = h("select", { id: posId, "data-testid": "position" });
      const headId = uid("f");
      const head = h("input", { id: headId, type: "checkbox", role: "switch", checked: st.head, "data-testid": "head" });
      head.addEventListener("change", () => {
        st.head = head.checked;
        st.headTouched = true;
      });
      function fillPos() {
        replace(
          pos,
          h("option", { value: "" }, "— აირჩიეთ თანამდებობა —"),
          (prof()?.entries || []).map((e) => h("option", { value: e.id, selected: e.id === st.entryId }, `${e.positions_ka?.join(" / ") || e.title_ka} (${e.percent}%)`))
        );
      }
      pos.addEventListener("change", () => {
        st.entryId = pos.value || null;
        const e = prof()?.entries.find((x) => x.id === st.entryId);
        if (!st.headTouched) {
          st.head = suggestHead2(e);
          head.checked = st.head;
        }
        body.querySelector("[data-need]")?.setAttribute("hidden", "");
      });
      fillPos();
      const ageId = uid("f");
      const age = h("input", { id: ageId, type: "text", inputmode: "numeric", class: "short", value: st.ageRaw, placeholder: "მაგ. 40", "aria-describedby": ageId + "-h" });
      age.addEventListener("input", () => {
        st.ageRaw = age.value;
      });
      const famList = h("div", { class: "fam" });
      const addBtn = h("button", { type: "button", class: "btn-add", "data-testid": "add-family" }, "+ ოჯახის წევრი");
      addBtn.addEventListener("click", () => {
        st.family.push({ id: "F" + st.nextId++, role: st.family.some((f) => f.role === "spouse") ? "child" : "spouse", ageRaw: "" });
        fillFam();
        famList.lastElementChild?.querySelector("select")?.focus();
      });
      function fillFam() {
        replace(famList, st.family.length ? st.family.map((f, i) => {
          const rid = uid("f");
          const aid = uid("f");
          const role = h("select", { id: rid }, Object.entries(ROLE_KA2).map(([v2, t]) => h("option", { value: v2, selected: f.role === v2 }, t)));
          role.addEventListener("change", () => {
            f.role = role.value;
          });
          const a = h("input", { id: aid, type: "text", inputmode: "numeric", value: f.ageRaw, placeholder: "ასაკი" });
          a.addEventListener("input", () => {
            f.ageRaw = a.value;
          });
          const del = h("button", { type: "button", class: "x", "aria-label": `ოჯახის წევრი ${i + 1}-ის წაშლა` }, "×");
          del.addEventListener("click", () => {
            st.family.splice(i, 1);
            delete st.edu[f.id];
            fillFam();
            (famList.querySelector("select") || addBtn).focus();
          });
          return h(
            "div",
            { class: "fam-row", "data-member": f.id },
            h("label", { for: rid, class: "sr-only" }, `ოჯახის წევრი ${i + 1} — როლი`),
            role,
            h("label", { for: aid, class: "sr-only" }, `ოჯახის წევრი ${i + 1} — ასაკი`),
            a,
            del
          );
        }) : h("p", { class: "muted small" }, "ოჯახის წევრები არ არის დამატებული."));
      }
      fillFam();
      return [
        ...title("თანამდებობა და ოჯახი"),
        seg,
        h("div", { class: "field" }, h("label", { for: posId }, "თანამდებობა"), pos),
        need("აირჩიეთ თანამდებობა."),
        h("div", { class: "toggle" }, head, h("label", { for: headId }, h("strong", null, "წარმომადგენლობის ხელმძღვანელი"), h("span", { class: "muted small" }, "ქირის ზედმეტის 80% ანაზღაურდება (სხვებს — 50%)"))),
        h("div", { class: "field" }, h("label", { for: ageId }, "თქვენი ასაკი"), age, h("p", { id: ageId + "-h", class: "muted small" }, "საჭიროა მხოლოდ დაზღვევის ლიმიტისთვის; შეიძლება დატოვოთ ცარიელი.")),
        h("h3", null, "ოჯახი (თან მიგყვებიან)"),
        famList,
        addBtn
      ];
    }
    function moneyField(label, get, set, opts = {}) {
      const id = uid("f");
      const err = h("p", { class: "err", id: id + "-e" });
      const inp = h("input", { id, type: "text", inputmode: "decimal", autocomplete: "off", value: get(), placeholder: opts.placeholder ?? "0.00", "aria-describedby": id + "-e", "data-testid": opts.testid ?? null });
      const check = () => {
        const r = parseMoney(inp.value);
        err.textContent = r.error ?? "";
        if (r.error) inp.setAttribute("aria-invalid", "true");
        else inp.removeAttribute("aria-invalid");
      };
      inp.addEventListener("input", () => {
        set(inp.value);
        check();
      });
      if (get()) check();
      return { el: h("div", { class: "field" }, h("label", { for: id }, label), h("div", { class: "with-cur" }, inp, h("span", { class: "cur" }, opts.cur ?? "")), err, opts.after ?? null), inp };
    }
    function step3() {
      const m = mission();
      const cur = m?.fundingCurrency ?? "";
      const chipBox = h("div", { class: "chip-box", "aria-live": "polite" });
      const rent = moneyField("ბინის ქირა თვეში", () => st.rentRaw, (v2) => {
        st.rentRaw = v2;
        st.rentFromMarket = false;
      }, { cur, testid: "rent", after: chipBox });
      const fillChip = () => {
        const avg = rentFor(market.md, beds());
        if (avg == null || market.md?.currency !== cur) {
          replace(chipBox);
          return;
        }
        const b = h("button", { type: "button", class: "chip", "data-testid": "use-market-rent" }, `Numbeo-ს საშუალო (ცენტრი, ${beds()} საძინებელი): ${formatAmount(avg)} ${cur} — გამოყენება`);
        b.addEventListener("click", () => {
          st.rentRaw = avg;
          st.rentFromMarket = true;
          st.marketRef = { locationId: market.md.requestedLocationId, providerId: market.md.provider?.id ?? "numbeo-apify", metric: `centre_${beds()}br`, fetchedAt: market.md.fetchedAt ?? null };
          rent.inp.value = avg;
          rent.inp.dispatchEvent(new Event("change"));
          rent.inp.focus();
        });
        replace(chipBox, b);
      };
      refreshMarket = fillChip;
      fillChip();
      loadMarket();
      const kids = st.family.filter((f) => f.role === "child");
      const extra = (key, label, ...inner) => {
        const id = uid("f");
        const cb = h("input", { id, type: "checkbox", checked: st.ex[key], "data-testid": `ex-${key}` });
        const box = h("div", { class: "ex-body", hidden: !st.ex[key] }, ...inner);
        cb.addEventListener("change", () => {
          st.ex[key] = cb.checked;
          box.hidden = !cb.checked;
          if (cb.checked) box.querySelector("input")?.focus();
        });
        return h("div", { class: "ex" + (st.ex[key] ? " on" : "") }, h("div", { class: "ex-head" }, cb, h("label", { for: id }, label)), box);
      };
      const lim = calc(scenario({ rent: null }));
      const caps = (lim?.insurance?.perPerson || []).filter((p) => p.annualCap?.value != null);
      const capTxt = caps.length ? caps.map((p) => `${p.personId === "EMP" ? "თქვენ" : p.label ?? p.personId}: ${formatAmount(p.annualCap.value)} ${cur}`).join(" · ") : "ლიმიტი გამოჩნდება ასაკის მითითებისას (საფეხური 2).";
      const bagCap = lim?.oneTimeReimbursements?.baggage?.cap?.value;
      const curSel = h("select", { "aria-label": "ნორმის ვალუტა", class: "cur-sel" }, ["EUR", "USD"].map((c) => h("option", { value: c, selected: (st.dailyCur || cur) === c }, c)));
      curSel.addEventListener("change", () => {
        st.dailyCur = curSel.value;
      });
      return [
        ...title("ქირა, სწავლა, ხარჯები", "თვიური თანხები. თუ ქირა ჯერ არ იცით — დატოვეთ ცარიელი."),
        rent.el,
        kids.length ? h("h3", null, "სკოლა / ბაღი") : null,
        kids.map((f, i) => moneyField(`სკოლა/ბაღი — თვიური გადასახადი (შვილი ${i + 1}${parseAge(f.ageRaw) != null ? ", " + parseAge(f.ageRaw) + " წ." : ""})`, () => st.edu[f.id] ?? "", (v2) => {
          st.edu[f.id] = v2;
        }, { cur, testid: "edu" }).el),
        h("h3", null, "დამატებითი ხარჯები"),
        h(
          "div",
          { class: "extras" },
          extra(
            "insurance",
            "დაზღვევა",
            h("p", { class: "small" }, "წლიური ლიმიტი: ", capTxt),
            moneyField("პოლისის ფაქტიური ფასი (არასავალდებულო)", () => st.policyRaw, (v2) => {
              st.policyRaw = v2;
            }, { cur }).el
          ),
          extra(
            "baggage",
            "ბარგის გადაზიდვა",
            h("p", { class: "small" }, `ლიმიტი: ${bagCap ? formatAmount(bagCap) + " " + cur : "—"}`),
            moneyField("ფაქტიური ხარჯი (არასავალდებულო)", () => st.bagRaw, (v2) => {
              st.bagRaw = v2;
            }, { cur }).el
          ),
          extra("broker", "მაკლერის მომსახურება", moneyField("მაკლერის საკომისიო", () => st.brokerRaw, (v2) => {
            st.brokerRaw = v2;
          }, { cur }).el),
          extra(
            "settlement",
            "პირველადი მოწყობა",
            h("p", { class: "small muted" }, "დღიური ნორმა მონაცემებში არ არის — მიუთითეთ თავად."),
            h("div", { class: "row2" }, moneyField("დღიური ნორმა", () => st.dailyRaw, (v2) => {
              st.dailyRaw = v2;
            }).el, curSel)
          )
        )
      ];
    }
    function step4() {
      const sc = scenario();
      const r = calc(sc);
      const noRent = sc.rent.amount == null;
      return renderResult({ r, st, sc, noRent, mission: mission(), data, meta: meta2, onPrint: () => window.print(), onCompare: () => compare.open(), shortName });
    }
    render();
    return { get state() {
      return st;
    } };
  }
